[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opkit"
version = "1.0.0"
description = "A session-oriented layer for connecting AI agents to machines over their native management protocols"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asyncssh>=2.21,<3",
  "httpx>=0.27,<1",
  "mcp>=1.20,<2",
  "pyyaml>=6,<7",
]

[project.scripts]
opkit = "opkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opkit"]
